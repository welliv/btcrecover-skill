name: Sign and Release

# Triggers on every version tag push (v1.0, v1.1, etc.)
on:
  push:
    tags:
      - 'v*'

# Also run on manual dispatch for re-signing if needed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sign (e.g. v1.0)'
        required: true

jobs:
  sign-and-release:
    name: Generate checksums, sign with Cosign + GPG, publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Create GitHub releases and upload assets
      id-token: write       # Required for keyless Cosign OIDC signing

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for tag resolution

      # -----------------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        # Installs the latest stable Cosign — records in Rekor transparency log

      # -----------------------------------------------------------------------
      - name: Generate SHA256 checksums for all skill files
        run: |
          # All files that form part of the verifiable skill installation
          sha256sum \
            SKILL.md \
            README.md \
            MAINTAINERS.md \
            DISCLAIMER.md \
            SECURITY.md \
            VERIFIED.md \
            PROJECT.md \
            install.sh \
            references/safety-rules.md \
            references/benchmarks.json \
            references/wallet-types.md \
            references/typo-patterns.md \
            scripts/connectivity-check.sh \
            scripts/sweep-reminder.sh \
            scripts/session-manager.sh \
            scripts/nuke-session.sh \
            scripts/benchmark-updater.py \
            scripts/verify-btcrecover.sh \
            scripts/typosquat-monitor.py \
            skills/password/SKILL.md \
            skills/seed/SKILL.md \
            skills/forensics/SKILL.md \
            agents/hermes.md \
            agents/claude-code.md \
            agents/cline.md \
            agents/cursor.md \
            agents/generic.md \
            guides/local-recovery-setup.md \
          > CHECKSUMS.sha256

          echo "Generated CHECKSUMS.sha256:"
          cat CHECKSUMS.sha256

      # -----------------------------------------------------------------------
      - name: Sign CHECKSUMS with Cosign (keyless — GitHub OIDC)
        run: |
          # Keyless signing: no private key to manage
          # Certificate is issued by Sigstore's Fulcio CA tied to this
          # workflow's GitHub OIDC identity — recorded in Rekor
          cosign sign-blob \
            --yes \
            --bundle CHECKSUMS.sha256.bundle \
            CHECKSUMS.sha256

          echo "Cosign bundle generated: CHECKSUMS.sha256.bundle"

      # -----------------------------------------------------------------------
      - name: Sign CHECKSUMS with GPG (author identity)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import the author's GPG private key from repository secrets
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1

          # Sign the checksums file
          # Handle both empty and non-empty passphrases
          if [ -z "$GPG_PASSPHRASE" ]; then
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase '' \
              --clearsign \
              --armor \
              --output CHECKSUMS.sha256.asc \
              CHECKSUMS.sha256
          else
            echo "$GPG_PASSPHRASE" | gpg \
              --batch \
              --yes \
              --passphrase-fd 0 \
              --clearsign \
              --armor \
              --output CHECKSUMS.sha256.asc \
              CHECKSUMS.sha256
          fi

          # Verify the clearsigned file (signature is embedded in clearsign output)
          gpg --verify CHECKSUMS.sha256.asc 2>&1
          echo "GPG signature verified successfully"

      # -----------------------------------------------------------------------
      - name: Verify Cosign bundle (belt and braces)
        run: |
          cosign verify-blob \
            --bundle CHECKSUMS.sha256.bundle \
            --certificate-identity-regexp="github.com/${{ github.repository_owner }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            CHECKSUMS.sha256
          echo "Cosign verification passed"

      # -----------------------------------------------------------------------
      - name: Get tag info
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      - name: Create GitHub Release with signed artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "btcrecover skill ${{ steps.tag.outputs.tag }}"
          body: |
            ## btcrecover skill ${{ steps.tag.outputs.tag }}

            Released: ${{ steps.tag.outputs.date }}

            ### Verify this release

            **One command (recommended):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            **Manual verification:**
            ```bash
            # Cosign (Sigstore)
            cosign verify-blob \
              --bundle CHECKSUMS.sha256.bundle \
              --certificate-identity-regexp="github.com/${{ github.repository_owner }}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              CHECKSUMS.sha256

            # GPG
            gpg --verify CHECKSUMS.sha256.asc CHECKSUMS.sha256

            # File integrity
            sha256sum -c CHECKSUMS.sha256
            ```

            ### Author identity
            - GitHub: https://github.com/welliv

            ### Built on
            - btcrecover by Stephen Rothery: https://github.com/3rdIteration/btcrecover
          files: |
            CHECKSUMS.sha256
            CHECKSUMS.sha256.bundle
            CHECKSUMS.sha256.asc
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          # Tags like v1.0-rc1 are marked as pre-release automatically

      # -----------------------------------------------------------------------
      - name: Summary
        run: |
          echo "## Release ${{ steps.tag.outputs.tag }} signed and published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| CHECKSUMS.sha256 | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| CHECKSUMS.sha256.bundle | ✅ Cosign signed (Rekor recorded) |" >> $GITHUB_STEP_SUMMARY
          echo "| CHECKSUMS.sha256.asc | ✅ GPG signed (Keybase identity) |" >> $GITHUB_STEP_SUMMARY
